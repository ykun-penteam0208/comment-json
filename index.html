<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コメントJSONジェネレーター</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Driver.js CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.css"/>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.5s ease, color 0.5s ease;
        }
        /* Custom scrollbar for JSON preview */
        pre::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        pre::-webkit-scrollbar-track {
            background: #1e293b;
        }
        pre::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        /* Comment Season Theme Styles */
        .comment-season-spring {
            background: linear-gradient(135deg, rgba(244, 114, 182, 0.12), rgba(30, 27, 46, 0.85));
            border-color: rgba(244, 114, 182, 0.4);
        }
        .comment-season-summer {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.12), rgba(15, 23, 42, 0.85));
            border-color: rgba(6, 182, 212, 0.4);
        }
        .comment-season-autumn {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.12), rgba(35, 20, 15, 0.85));
            border-color: rgba(245, 158, 11, 0.4);
        }
        .comment-season-winter {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.12), rgba(15, 23, 42, 0.85));
            border-color: rgba(99, 102, 241, 0.4);
        }

        /* Driver.js Custom Styling Overrides */
        .driver-popover {
            background-color: #0f172a !important;
            color: #f8fafc !important;
            border: 1px solid #334155 !important;
            border-radius: 0.75rem !important;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04) !important;
            font-family: 'Inter', sans-serif !important;
            max-width: 360px !important;
        }
        .driver-popover-title {
            color: #f1f5f9 !important;
            font-weight: 700 !important;
            font-size: 0.95rem !important;
        }
        .driver-popover-description {
            color: #cbd5e1 !important;
            font-size: 0.825rem !important;
            line-height: 1.5 !important;
        }
        .driver-popover-footer button {
            background-color: #312e81 !important;
            color: #e0e7ff !important;
            border: 1px solid #4338ca !important;
            text-shadow: none !important;
            font-size: 0.75rem !important;
            border-radius: 0.375rem !important;
            padding: 0.375rem 0.75rem !important;
        }
        .driver-popover-footer button:hover {
            background-color: #3730a3 !important;
            color: #ffffff !important;
        }
        .driver-popover-next-btn {
            display: inline-block !important;
        }
        .driver-popover-navigation-btns {
            gap: 0.375rem !important;
        }
        .driver-popover-close-btn {
            color: #94a3b8 !important;
        }
        .driver-popover-close-btn:hover {
            color: #ffffff !important;
        }
    </style>
</head>
<body class="theme-spring text-slate-100 min-h-screen flex flex-col relative overflow-x-hidden">

    <!-- Header -->
    <header class="bg-slate-900/80 backdrop-blur border-b border-slate-700/80 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            <div id="header-logo-group" class="flex items-center gap-3">
                <div id="header-icon-bg" class="p-2 bg-indigo-600 rounded-lg text-white">
                    <i data-lucide="message-square-plus" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-white leading-tight flex items-center gap-2">
                        Comment JSON Builder
                    </h1>
                    <p class="text-xs text-slate-400">日付ごとの季節テーマ ＆ 住所対応コメントジェネレーター</p>
                </div>
            </div>

            <!-- Action Buttons in Header -->
            <div class="flex items-center gap-2">
                <button id="btn-start-tour" onclick="startTour()" class="flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-amber-300 hover:text-white bg-amber-950/60 hover:bg-amber-900/80 border border-amber-600/40 rounded-lg transition active:scale-95 shadow-sm">
                    <i data-lucide="help-circle" class="w-4 h-4"></i>
                    <span>使い方ガイド</span>
                </button>
                <button id="btn-open-import" onclick="openImportModal()" class="flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-emerald-300 hover:text-white bg-emerald-950/60 hover:bg-emerald-900/80 border border-emerald-600/40 rounded-lg transition">
                    <i data-lucide="upload-cloud" class="w-4 h-4"></i>
                    <span>データ読込</span>
                </button>
                <button id="btn-reset-all" onclick="resetData()" class="flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-slate-300 hover:text-white bg-slate-800/80 hover:bg-slate-700 border border-slate-700 rounded-lg transition">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    <span class="hidden md:inline">リセット</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-12 gap-6 z-10 relative">

        <!-- Editor Column (Left) -->
        <section class="lg:col-span-7 flex flex-col gap-4">
            <div class="flex items-center justify-between">
                <h2 class="text-base font-semibold text-slate-200 flex items-center gap-2">
                    <i data-lucide="edit-3" class="w-5 h-5 text-indigo-400"></i>
                    コメント一覧の編集
                </h2>
                <button id="add-comment-btn" onclick="addRootComment()" class="flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm rounded-lg shadow-lg shadow-indigo-600/20 transition duration-150">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    親コメントを追加
                </button>
            </div>

            <!-- Comments Container -->
            <div id="comments-container" class="space-y-4">
                <!-- Dynamic comment cards will be rendered here -->
            </div>
        </section>

        <!-- Preview Column (Right) -->
        <section id="preview-section" class="lg:col-span-5 flex flex-col gap-4 lg:sticky lg:top-20 h-fit">
            <div class="flex items-center justify-between">
                <!-- Format Mode Selector Tabs -->
                <div id="format-tab-group" class="flex items-center gap-1 bg-slate-900/90 border border-slate-700/80 p-1 rounded-xl">
                    <button id="tab-json" onclick="setFormatMode('json')" class="px-3 py-1 rounded-lg text-xs font-semibold transition bg-indigo-600 text-white shadow">JSON</button>
                    <button id="tab-xml" onclick="setFormatMode('xml')" class="px-3 py-1 rounded-lg text-xs font-semibold transition text-slate-400 hover:text-slate-200">XML</button>
                </div>

                <div id="json-actions" class="flex items-center gap-2">
                    <button id="btn-copy-json" onclick="copyData()" class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-medium rounded-lg transition active:scale-95">
                        <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                        <span id="copy-btn-text">コピー</span>
                    </button>
                    <button id="btn-download-json" onclick="downloadData()" class="flex items-center gap-1.5 px-3 py-1.5 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 text-xs font-medium rounded-lg transition active:scale-95">
                        <i data-lucide="download" class="w-3.5 h-3.5"></i>
                        <span>保存</span>
                    </button>
                </div>
            </div>

            <!-- Output Box -->
            <div id="json-box" class="relative bg-slate-950/90 border border-slate-800 rounded-xl overflow-hidden shadow-2xl backdrop-blur">
                <div id="json-meta-bar" class="bg-slate-900/60 px-4 py-2 border-b border-slate-800/80 flex items-center justify-between">
                    <span id="output-filename" class="text-xs font-mono text-slate-400">comments.json</span>
                    <span id="json-size" class="text-xs text-slate-500">0 bytes</span>
                </div>
                <pre id="json-preview" class="p-4 text-xs font-mono text-emerald-400 overflow-x-auto max-h-[calc(100vh-16rem)] min-h-[300px] leading-relaxed select-all"></pre>
            </div>
        </section>
    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 translate-y-20 opacity-0 transition-all duration-300 bg-slate-800 border border-slate-700 text-white px-4 py-3 rounded-lg shadow-2xl flex items-center gap-3 z-50">
        <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-400"></i>
        <span id="toast-message" class="text-sm font-medium"></span>
    </div>

    <!-- Import Modal (Supports JSON and XML) -->
    <div id="import-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div id="modal-content-box" class="bg-slate-900 border border-slate-700 rounded-xl w-full max-w-xl p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 id="modal-title" class="font-bold text-white text-base flex items-center gap-2">
                    <i data-lucide="file-code" class="w-5 h-5 text-emerald-400"></i>
                    JSON / XML データからコメントを復元
                </h3>
                <button id="modal-close-btn" onclick="closeImportModal()" class="text-slate-400 hover:text-white p-1 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div>
                <label id="modal-label" class="block text-xs font-semibold text-slate-300 mb-1">JSONまたはXMLテキストを貼り付けてください:</label>
                <textarea id="import-json-input" rows="8" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-xs font-mono text-emerald-400 focus:outline-none focus:border-indigo-500 transition leading-relaxed" placeholder="[{ &quot;name&quot;: &quot;...&quot; }] または <comments><comment>...</comment></comments>"></textarea>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button id="modal-cancel-btn" onclick="closeImportModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium rounded-lg transition">
                    キャンセル
                </button>
                <button id="modal-submit-btn" onclick="importData()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium rounded-lg shadow-lg shadow-emerald-600/20 transition">
                    復元する
                </button>
            </div>
        </div>
    </div>

    <!-- Driver.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.js.iife.js"></script>

    <!-- Application Script -->
    <script>
        const AVATAR_COLORS = [
            '#ef4444', '#f97316', '#f59e0b', '#10b981', 
            '#06b6d4', '#3b82f6', '#6366f1', '#a855f7', '#ec4899'
        ];

        const SEASONS_CONFIG = {
            spring: { name: "春", icon: "🌸", cardClass: "comment-season-spring", badgeClass: "bg-pink-500/20 text-pink-300 border-pink-500/40" },
            summer: { name: "夏", icon: "🌻", cardClass: "comment-season-summer", badgeClass: "bg-cyan-500/20 text-cyan-300 border-cyan-500/40" },
            autumn: { name: "秋", icon: "🍁", cardClass: "comment-season-autumn", badgeClass: "bg-amber-500/20 text-amber-300 border-amber-300/40" },
            winter: { name: "冬", icon: "❄️", cardClass: "comment-season-winter", badgeClass: "bg-indigo-500/20 text-indigo-300 border-indigo-500/40" }
        };

        let comments = [];
        let tourDriver = null;
        let formatMode = 'json'; // 'json' or 'xml'

        function setFormatMode(mode) {
            formatMode = mode;
            const tabJson = document.getElementById('tab-json');
            const tabXml = document.getElementById('tab-xml');
            const filenameEl = document.getElementById('output-filename');

            if (mode === 'json') {
                tabJson.className = "px-3 py-1 rounded-lg text-xs font-semibold transition bg-indigo-600 text-white shadow";
                tabXml.className = "px-3 py-1 rounded-lg text-xs font-semibold transition text-slate-400 hover:text-slate-200";
                filenameEl.textContent = "comments.json";
            } else {
                tabXml.className = "px-3 py-1 rounded-lg text-xs font-semibold transition bg-indigo-600 text-white shadow";
                tabJson.className = "px-3 py-1 rounded-lg text-xs font-semibold transition text-slate-400 hover:text-slate-200";
                filenameEl.textContent = "comments.xml";
            }
            renderJSONOnly();

            if (tourDriver && tourDriver.isActive()) {
                const idx = tourDriver.getActiveIndex();
                if (mode === 'xml' && idx === 21) advanceTourIfActive(21);
                else if (mode === 'json' && idx === 23) advanceTourIfActive(23);
            }
        }

        function getSeasonFromDate(dateStr) {
            if (!dateStr) return 'spring';
            const parts = dateStr.split('-');
            if (parts.length < 2) return 'spring';
            const month = parseInt(parts[1], 10);
            if (month >= 3 && month <= 5) return 'spring';
            if (month >= 6 && month <= 8) return 'summer';
            if (month >= 9 && month <= 11) return 'autumn';
            return 'winter';
        }

        function generateId() {
            return 'c_' + Math.random().toString(36).substr(2, 9);
        }

        function getFormattedDate() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function getRandomColor() {
            return AVATAR_COLORS[Math.floor(Math.random() * AVATAR_COLORS.length)];
        }

        function advanceTourIfActive(targetStepIndex = null) {
            if (tourDriver && tourDriver.isActive()) {
                if (targetStepIndex === null || tourDriver.getActiveIndex() === targetStepIndex) {
                    setTimeout(() => {
                        tourDriver.moveNext();
                    }, 250);
                }
            }
        }

        function addRootComment() {
            const todayStr = getFormattedDate();
            comments.push({
                id: generateId(),
                name: "山田 太郎",
                address: "東京都千代田区",
                avatarBase64: "",
                bgColor: getRandomColor(),
                date: todayStr,
                text: "新しい親コメントだベ！",
                likes: 0,
                dislikes: 0,
                replies: []
            });
            render();
            showToast("新しいコメントを追加しました");
            advanceTourIfActive(1); // 2番目のステップ（親コメント追加）から次へ
        }

        function addReply(parentId) {
            const target = findCommentById(comments, parentId);
            if (target) {
                target.replies.push({
                    id: generateId(),
                    name: "佐藤 次郎",
                    address: "大阪府大阪市",
                    avatarBase64: "",
                    bgColor: getRandomColor(),
                    date: getFormattedDate(),
                    text: "返信内容を入力するベ！",
                    likes: 0,
                    dislikes: 0,
                    replies: []
                });
                render();
                advanceTourIfActive(17); // 18番目（返信追加）から次へ
            }
        }

        function deleteComment(id) {
            function removeRecursive(list, targetId) {
                return list.filter(item => {
                    if (item.id === targetId) return false;
                    if (item.replies && item.replies.length > 0) {
                        item.replies = removeRecursive(item.replies, targetId);
                    }
                    return true;
                });
            }
            comments = removeRecursive(comments, id);
            render();
            showToast("コメントを削除しました");
            advanceTourIfActive(20); // 21番目（コメント削除）から次へ
        }

        function findCommentById(list, id) {
            for (let item of list) {
                if (item.id === id) return item;
                if (item.replies && item.replies.length > 0) {
                    const found = findCommentById(item.replies, id);
                    if (found) return found;
                }
            }
            return null;
        }

        function updateField(id, field, value) {
            const target = findCommentById(comments, id);
            if (target) {
                if (field === 'likes' || field === 'dislikes') {
                    target[field] = parseInt(value, 10) || 0;
                } else {
                    target[field] = value;
                }

                if (field === 'date') {
                    render();
                } else {
                    renderJSONOnly();
                }

                if (tourDriver && tourDriver.isActive()) {
                    const idx = tourDriver.getActiveIndex();
                    if (field === 'name' && idx === 4) advanceTourIfActive(4);
                    else if (field === 'address' && idx === 5) advanceTourIfActive(5);
                    else if (field === 'date' && idx === 7) advanceTourIfActive(7);
                    else if (field === 'bgColor' && idx === 12) advanceTourIfActive(12);
                    else if (field === 'text' && idx === 13) advanceTourIfActive(13);
                    else if (field === 'likes' && idx === 15) advanceTourIfActive(15);
                    else if (field === 'dislikes' && idx === 16) advanceTourIfActive(16);
                }
            }
        }

        function handleAvatarUpload(id, fileInput) {
            const file = fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                const target = findCommentById(comments, id);
                if (target) {
                    target.avatarBase64 = e.target.result;
                    render();
                    showToast("アイコン画像を更新しました");
                    advanceTourIfActive(2); // 3番目（アバター画像設定）から次へ
                }
            };
            reader.readAsDataURL(file);
        }

        function clearAvatar(id) {
            const target = findCommentById(comments, id);
            if (target) {
                target.avatarBase64 = "";
                render();
                advanceTourIfActive(3); // 4番目（画像クリア）から次へ
            }
        }

        function resetData() {
            comments = [];
            closeImportModal();
            render();
            showToast("データをリセットしました");
            advanceTourIfActive(32); // 33番目（リセット）から次へ
        }

        function openImportModal() {
            document.getElementById('import-json-input').value = '';
            document.getElementById('import-modal').classList.remove('hidden');
            advanceTourIfActive(28); // 29番目（データ読込画面起動）から次へ
        }

        function closeImportModal() {
            document.getElementById('import-modal').classList.add('hidden');
        }

        function normalizeImportedComments(list) {
            if (!Array.isArray(list)) return [];
            return list.map(item => ({
                id: item.id || generateId(),
                name: item.name || "名前なし",
                address: (item.address && item.address !== "不明") ? item.address : "",
                avatarBase64: item.avatarBase64 || "",
                bgColor: item.bgColor || getRandomColor(),
                date: item.date || getFormattedDate(),
                text: item.text || "",
                likes: parseInt(item.likes, 10) || 0,
                dislikes: parseInt(item.dislikes, 10) || 0,
                replies: normalizeImportedComments(item.replies || [])
            }));
        }

        // --- XML Converter Helpers ---
        function jsonToXml(list, indent = 2) {
            function buildXml(arr, level) {
                const space = " ".repeat(level * indent);
                let xml = "";
                arr.forEach(item => {
                    xml += `${space}<comment id="${escapeHtml(item.id)}">\n`;
                    xml += `${space}  <name>${escapeHtml(item.name || '匿名')}</name>\n`;
                    xml += `${space}  <address>${escapeHtml((item.address && item.address.trim() !== '') ? item.address : '不明')}</address>\n`;
                    xml += `${space}  <avatarBase64>${escapeHtml(item.avatarBase64 || '')}</avatarBase64>\n`;
                    xml += `${space}  <bgColor>${escapeHtml(item.bgColor || '#6366f1')}</bgColor>\n`;
                    xml += `${space}  <date>${escapeHtml(item.date || '')}</date>\n`;
                    xml += `${space}  <text>${escapeHtml(item.text || '')}</text>\n`;
                    xml += `${space}  <likes>${item.likes || 0}</likes>\n`;
                    xml += `${space}  <dislikes>${item.dislikes || 0}</dislikes>\n`;
                    if (item.replies && item.replies.length > 0) {
                        xml += `${space}  <replies>\n`;
                        xml += buildXml(item.replies, level + 2);
                        xml += `${space}  </replies>\n`;
                    } else {
                        xml += `${space}  <replies/>\n`;
                    }
                    xml += `${space}</comment>\n`;
                });
                return xml;
            }
            return `<?xml version="1.0" encoding="UTF-8"?>\n<comments>\n${buildXml(list, 1)}</comments>`;
        }

        function xmlToJson(xmlText) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, "text/xml");
            if (xmlDoc.getElementsByTagName("parsererror").length > 0) {
                throw new Error("XML Parsing error");
            }
            function parseNodes(parent) {
                const result = [];
                const commentNodes = parent.children;
                for (let i = 0; i < commentNodes.length; i++) {
                    const node = commentNodes[i];
                    if (node.tagName.toLowerCase() === 'comment') {
                        const getVal = (tag) => {
                            const el = node.getElementsByTagName(tag)[0];
                            return el ? el.textContent : '';
                        };
                        const repliesNode = node.getElementsByTagName('replies')[0];
                        const childReplies = repliesNode ? parseNodes(repliesNode) : [];
                        result.push({
                            id: node.getAttribute('id') || generateId(),
                            name: getVal('name'),
                            address: getVal('address'),
                            avatarBase64: getVal('avatarBase64'),
                            bgColor: getVal('bgColor'),
                            date: getVal('date'),
                            text: getVal('text'),
                            likes: parseInt(getVal('likes'), 10) || 0,
                            dislikes: parseInt(getVal('dislikes'), 10) || 0,
                            replies: childReplies
                        });
                    }
                }
                return result;
            }
            const rootComments = xmlDoc.getElementsByTagName('comments')[0];
            return rootComments ? parseNodes(rootComments) : [];
        }

        function importData() {
            const rawText = document.getElementById('import-json-input').value.trim();
            if (!rawText) {
                showToast("テキストを入力してください");
                return;
            }

            try {
                let parsed = [];
                if (rawText.startsWith('<') || rawText.includes('<?xml')) {
                    parsed = xmlToJson(rawText);
                } else {
                    parsed = JSON.parse(rawText);
                }

                if (!Array.isArray(parsed)) {
                    showToast("有効なデータ構造ではありません");
                    return;
                }

                comments = normalizeImportedComments(parsed);
                render();
                closeImportModal();
                showToast("データを正常に復元しました！");
                advanceTourIfActive(30); // 31番目（データ一括復元）から次へ
            } catch (e) {
                showToast("データの読み込みに失敗しました（構文エラー）");
            }
        }

        function render() {
            const container = document.getElementById('comments-container');
            container.innerHTML = '';

            if (comments.length === 0) {

                comments.forEach((comment, index) => {
                    container.appendChild(createCommentCard(comment, 0, index === 0));

        function processCommentsForExport(list) {
            return list.map(item => ({
                id: item.id,
                name: item.name || "匿名",
                address: (item.address && item.address.trim() !== "") ? item.address : "不明",
                avatarBase64: item.avatarBase64 || "",
                bgColor: item.bgColor,
                date: item.date,
                text: item.text,
                likes: item.likes,
                dislikes: item.dislikes,
                replies: processCommentsForExport(item.replies || [])
            }));
        }

        function getOutputText() {
            const processedData = processCommentsForExport(comments);
            if (formatMode === 'xml') {
                return jsonToXml(processedData);
            }
            return JSON.stringify(processedData, null, 2);
        }

        function renderJSONOnly() {
            const outputText = getOutputText();
            const previewEl = document.getElementById('json-preview');
            if (previewEl) previewEl.textContent = outputText;
            
            const bytes = new Blob([outputText]).size;
            const sizeEl = document.getElementById('json-size');
            if (sizeEl) sizeEl.textContent = `${bytes.toLocaleString()} bytes`;
        }

        function copyData() {
            const outputText = getOutputText();
            const textArea = document.createElement("textarea");
            textArea.value = outputText;
            document.body.appendChild(textArea);
            textArea.select();
            
            try {
                document.execCommand('copy');
                const btnText = document.getElementById('copy-btn-text');
                if (btnText) {
                    btnText.textContent = "コピー完了!";
                    setTimeout(() => { btnText.textContent = "コピー"; }, 2000);
                }
                showToast(`${formatMode.toUpperCase()}をクリップボードにコピーしました`);
            } catch (err) {
                showToast("コピーに失敗しました");
            }
            document.body.removeChild(textArea);
            advanceTourIfActive(25); // 26番目（コードコピー機能）から次へ
        }

        function downloadData() {
            const outputText = getOutputText();
            const mimeType = formatMode === 'xml' ? 'application/xml' : 'application/json';
            const ext = formatMode === 'xml' ? 'xml' : 'json';
            const blob = new Blob([outputText], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `comments_${new Date().toISOString().slice(0,10)}.${ext}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast(`${formatMode.toUpperCase()}ファイルを保存しました`);
            advanceTourIfActive(26); // 27番目（ファイル保存）から次へ
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
